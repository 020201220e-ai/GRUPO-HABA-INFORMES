<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California Housing Predictor | Premium AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .actions {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        button {
            width: 100%;
            max-width: 400px;
            padding: 16px 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-card {
            margin-top: 30px;
            width: 100%;
            padding: 24px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px dashed var(--primary);
            border-radius: 16px;
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4ade80;
            margin-top: 8px;
        }

        .config-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .config-toggle:hover {
            color: white;
            border-color: var(--primary);
        }

        .badge-pro {
            background: linear-gradient(to right, #f59e0b, #ef4444);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>🏠 Predictor California <span class="badge-pro">Pro</span></h1>
            <p class="subtitle">Estimación de valor de propiedad impulsada por IA</p>
        </header>

        <div class="grid">
            <div class="input-group">
                <label for="MedInc">Ingreso Medio ($10k)</label>
                <input type="number" id="MedInc" value="3.5" step="0.1">
            </div>

            <div class="input-group">
                <label for="HouseAge">Edad Media de la Vivienda</label>
                <input type="number" id="HouseAge" value="28" step="1">
            </div>

            <div class="input-group">
                <label for="AveRooms">Promedio Habitaciones</label>
                <input type="number" id="AveRooms" value="5" step="0.1">
            </div>

            <div class="input-group">
                <label for="AveBedrms">Promedio Dormitorios</label>
                <input type="number" id="AveBedrms" value="1" step="0.1">
            </div>

            <div class="input-group">
                <label for="Population">Población del Distrito</label>
                <input type="number" id="Population" value="1400" step="10">
            </div>

            <div class="input-group">
                <label for="AveOccup">Ocupación Promedio</label>
                <input type="number" id="AveOccup" value="3" step="0.1">
            </div>

            <div class="input-group">
                <label for="Latitude">Latitud</label>
                <input type="number" id="Latitude" value="34" step="0.01">
            </div>

            <div class="input-group">
                <label for="Longitude">Longitud</label>
                <input type="number" id="Longitude" value="-118" step="0.01">
            </div>
        </div>

        <div class="actions">
            <button id="predictBtn" onclick="predict()">
                <div class="loader" id="loader"></div>
                <span id="btnText">🚀 Calcular Valor de Mercado</span>
            </button>

            <div class="result-card" id="resultCard">
                <p style="font-size: 0.9rem; color: var(--text-muted);">Valor Estimado del Distrito</p>
                <div class="result-value" id="resultado"></div>
            </div>
        </div>
    </div>

    <div class="config-toggle" onclick="toggleEndpoint()">
        <span id="endpointLabel">🌐 Destino: Localhost (Puerto 8000)</span>
    </div>

    <script>
        let useLocal = true;

        function toggleEndpoint() {
            useLocal = !useLocal;
            const label = document.getElementById('endpointLabel');
            label.innerText = useLocal ? '🌐 Destino: Localhost (Puerto 8000)' : '🚀 Destino: Servidor en la Nube (Render)';
        }

        async function predict() {
            const btn = document.getElementById("predictBtn");
            const btnText = document.getElementById("btnText");
            const loader = document.getElementById("loader");
            const resultCard = document.getElementById("resultCard");
            const resultado = document.getElementById("resultado");

            // UI State: Loading
            btn.disabled = true;
            btnText.innerText = "Analizando Datos de Mercado...";
            loader.style.display = "block";
            resultCard.style.display = "none";

            const data = {
                MedInc: parseFloat(document.getElementById("MedInc").value),
                HouseAge: parseFloat(document.getElementById("HouseAge").value),
                AveRooms: parseFloat(document.getElementById("AveRooms").value),
                AveBedrms: parseFloat(document.getElementById("AveBedrms").value),
                Population: parseFloat(document.getElementById("Population").value),
                AveOccup: parseFloat(document.getElementById("AveOccup").value),
                Latitude: parseFloat(document.getElementById("Latitude").value),
                Longitude: parseFloat(document.getElementById("Longitude").value)
            };

            const url = useLocal ? "http://127.0.0.1:8000/predict" : "https://TU_API_AQUI.onrender.com/predict";

            try {
                // Simulate a tiny bit of loading for better UX
                await new Promise(resolve => setTimeout(resolve, 800));

                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error("API Response Error");

                const result = await response.json();

                resultCard.style.display = "block";
                resultado.innerHTML = "USD $" + (result.prediction * 100000).toLocaleString(undefined, {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                });

            } catch (error) {
                resultCard.style.display = "block";
                resultCard.style.background = "rgba(239, 68, 68, 0.1)";
                resultCard.style.borderColor = "#ef4444";
                resultado.style.color = "#ef4444";
                resultado.innerHTML = "❌ Error de Conexión";
                console.error(error);
            } finally {
                btn.disabled = false;
                btnText.innerText = "🚀 Calcular Valor de Mercado";
                loader.style.display = "none";
            }
        }
    </script>

</body>

</html>
